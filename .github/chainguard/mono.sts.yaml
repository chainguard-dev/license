# Grants mono's open-source-publish workflow write access to this repo for
# pushing exported commits on merge to mono's main.

issuer: https://token.actions.githubusercontent.com
subject_pattern: repo:chainguard-dev/mono:ref:refs/heads/main
claim_pattern:
  workflow_ref: chainguard-dev/mono/.github/workflows/open-source-publish.yaml@refs/heads/main

permissions:
  contents: write
